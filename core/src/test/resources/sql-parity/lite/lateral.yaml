# legend-lite's own Postgres-judged cases over upstream's parity schema: set-returning functions in FROM
# (generate_series, unnest) and LATERAL subqueries, each a Pure lateral of a flatten or of a correlated relation, at
# the edges: an empty or NULL range, a step down, an empty string, repeated delimiters, a name both sides hold.
# Each answer is snapped from Postgres 16 with upstream's (postgres-answers.jsonl, key lite/lateral/<id>).
tests:
  # generate_series
  - id: series_alone_named_by_its_alias
    sql: "SELECT g FROM generate_series(1, 4) AS g ORDER BY g"
  - id: series_alone_named_by_the_function
    sql: "SELECT generate_series FROM generate_series(3, 5) ORDER BY 1"
  - id: series_with_steps_up_and_down
    sql: "SELECT a.v AS up, b.v AS down FROM generate_series(1, 10, 4) AS a(v), generate_series(3, -3, -3) AS b(v) ORDER BY 1, 2"
  - id: series_that_is_empty
    sql: "SELECT count(*) AS n FROM generate_series(5, 1) AS g(v)"
  - id: series_step_zero_is_an_error
    sql: "SELECT v FROM generate_series(1, 3, 0) AS g(v)"
  - id: series_per_row_with_a_null_bound
    sql: "SELECT p.id, g.v FROM persons p, generate_series(1, p.dept_id) AS g(v) ORDER BY 1, 2"
  - id: series_per_row_from_an_expression
    sql: "SELECT d.id, g.v FROM departments d CROSS JOIN LATERAL generate_series(d.id * 2, d.id * 2 + 1) AS g(v) ORDER BY 1, 2"
  # unnest
  - id: unnest_constants_per_row
    sql: "SELECT d.name, u.x FROM departments d, unnest(ARRAY['a', 'b']) AS u(x) WHERE d.id <= 2 ORDER BY 1, 2"
  - id: unnest_row_values
    sql: "SELECT p.id, u.v FROM persons p CROSS JOIN LATERAL unnest(ARRAY[p.id, p.id * 10]) AS u(v) WHERE p.id <= 3 ORDER BY 1, 2"
  - id: unnest_decimals
    sql: "SELECT u.v FROM unnest(ARRAY[1.50, 2.25, -0.5]) AS u(v) ORDER BY 1"
  - id: unnest_a_nullable_element_is_refused
    sql: "SELECT u.v FROM persons p, unnest(ARRAY[p.age]) AS u(v)"
  - id: string_to_array_rows
    sql: "SELECT d.id, u.part FROM departments d, unnest(string_to_array(d.name, 'n')) AS u(part) ORDER BY 1, 2"
  - id: string_to_array_edges
    sql: "SELECT u.x FROM unnest(string_to_array('a,,b,', ',')) AS u(x) ORDER BY 1"
  - id: string_to_array_of_an_empty_string_has_no_rows
    sql: "SELECT count(*) AS n FROM unnest(string_to_array('', ',')) AS u(x)"
  - id: string_to_array_multi_character_delimiter
    sql: "SELECT u.x FROM unnest(string_to_array('k1::k2::k3', '::')) AS u(x) ORDER BY 1"
  # LATERAL subqueries
  - id: lateral_top_one_per_department
    sql: "SELECT d.name, t.name AS top FROM departments d CROSS JOIN LATERAL (SELECT p.name FROM persons p WHERE p.dept_id = d.id ORDER BY p.salary DESC NULLS LAST, p.id LIMIT 1) t ORDER BY d.id"
  - id: lateral_aggregate_per_row
    sql: "SELECT p.id, c.n FROM persons p, LATERAL (SELECT count(*) AS n FROM orders o WHERE o.person_id = p.id) c ORDER BY p.id"
  - id: lateral_join_on
    sql: "SELECT p.id, o.amount FROM persons p JOIN LATERAL (SELECT amount FROM orders o WHERE o.person_id = p.id) o ON o.amount > 300 ORDER BY 1, 2"
  - id: lateral_name_both_sides_hold
    sql: "SELECT p.id, x.id AS order_id FROM persons p CROSS JOIN LATERAL (SELECT o.id FROM orders o WHERE o.person_id = p.id) x ORDER BY 1, 2"
  - id: lateral_reads_the_item_before_it_twice
    sql: "SELECT p.id, a.v, b.w FROM persons p, generate_series(1, 2) AS a(v), LATERAL (SELECT a.v * 100 + p.id AS w) b WHERE p.id <= 2 ORDER BY 1, 2"
  - id: left_join_lateral_is_refused
    sql: "SELECT p.id, x.amount FROM persons p LEFT JOIN LATERAL (SELECT amount FROM orders o WHERE o.person_id = p.id) x ON true ORDER BY 1, 2"
  - id: a_subquery_without_lateral_cannot_read_the_items_before_it
    sql: "SELECT p.id FROM persons p, (SELECT o.amount FROM orders o WHERE o.person_id = p.id) x"
  # no FROM: one row
  - id: no_from_is_one_row
    sql: "SELECT 1 + 2 AS three, 'x' || 'y' AS xy, 2 > 1 AS yes"
  - id: no_from_filtered_away
    sql: "SELECT 1 AS one WHERE false"
  - id: no_from_star_is_an_error
    sql: "SELECT *"
  - id: lateral_select_without_from
    sql: "SELECT p.id, b.w FROM persons p, LATERAL (SELECT p.id * 100 AS w) b WHERE p.id <= 3 ORDER BY 1"
